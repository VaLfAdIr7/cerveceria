<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blade Runner</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#000;color:#e02020;font:clamp(1.1rem,3.5vw,1.6rem)/1.7 Georgia,serif;text-align:center;padding:2rem}p:last-child{text-align:right}a{color:#e02020}</style></head><body><main><p><br/>  <br/>
Yo... he visto cosas que vosotros<br/>
no creeríais.<br/>
Atacar naves en llamas<br/>
más allá de Orión.<br/>
He visto rayos-C brillar<br/> 
en la oscuridad,<br/>
cerca de la puerta de Tannhäuser.<br/>
Todos esos... momentos se perderán...<br/>
en el tiempo.<br/>
Como... lágrimas... en la lluvia.<br/>
Es hora... de morir.
